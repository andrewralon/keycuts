# Publishes a GitHub release when main carries a version that has no tag yet.
# To release: raise <Version> in Directory.Build.props on develop, then merge develop into main.
# Merges that keep the same version do nothing, so re-running this is always safe.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      macos_dry_run:
        description: "Only build, sign and notarize the macOS packages from this branch and keep them as a workflow artifact (no release, no cask)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    outputs:
      released: ${{ steps.create.outputs.released }}
      tag: ${{ steps.version.outputs.tag }}
    # A manual run from another branch would publish unmerged code and take the tag main needs.
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Read version
        id: version
        run: |
          $version = (dotnet msbuild keycuts.Common/keycuts.Common.csproj -getProperty:Version).Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Version '$version' in Directory.Build.props must be x.y.z." }
          $tag = "v$version"
          $exists = [bool](git ls-remote --tags origin "refs/tags/$tag")
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "exists=$($exists.ToString().ToLower())" >> $env:GITHUB_OUTPUT
          if ($exists) {
            $message = "$tag is already released; nothing to do. Raise <Version> in Directory.Build.props to release."
            "::notice::$message"
            "## keycuts $tag`n`n$message" | Add-Content $env:GITHUB_STEP_SUMMARY
          }

      - name: Test
        if: steps.version.outputs.exists == 'false'
        run: dotnet test keycuts.sln -c Release --logger "GitHubActions;summary-include-passed=false"

      - name: Build installers
        if: steps.version.outputs.exists == 'false'
        run: |
          ./tools/Build-Installer.ps1 -Runtime win-x64
          ./tools/Build-Installer.ps1 -Runtime win-arm64

      - name: Package
        if: steps.version.outputs.exists == 'false'
        run: |
          $out = 'artifacts/release'
          New-Item $out -ItemType Directory -Force | Out-Null
          foreach ($runtime in 'win-x64', 'win-arm64') {
            $arch = $runtime -replace '^win-', ''
            Copy-Item "artifacts/installer/$runtime/keycuts-setup-$arch.msi" $out
            Compress-Archive -Path "artifacts/publish/$runtime/*" -DestinationPath "$out/keycuts-portable-$runtime.zip"
          }
          Get-ChildItem $out -File | ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)" } |
            Set-Content "$out/SHA256SUMS.txt"
          Get-Content "$out/SHA256SUMS.txt"

      - name: Create release
        id: create
        if: steps.version.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          $assets = Get-ChildItem artifacts/release -File
          $url = gh release create $env:TAG $assets.FullName `
            --target $env:GITHUB_SHA `
            --title "keycuts $env:TAG" `
            --generate-notes
          if ($LASTEXITCODE -ne 0) { throw 'Creating the release failed.' }
          $lines = @(
            "## Released [keycuts $env:TAG]($url)"
            ''
            '| Asset | Size | SHA256 |'
            '|---|---|---|'
          )
          $lines += foreach ($asset in $assets) {
            "| $($asset.Name) | $([math]::Round($asset.Length / 1MB, 1)) MB | ``$((Get-FileHash $asset.FullName -Algorithm SHA256).Hash.ToLower())`` |"
          }
          $lines | Add-Content $env:GITHUB_STEP_SUMMARY
          'released=true' >> $env:GITHUB_OUTPUT

  # The macOS packages (docs/macos-port.md, Phase 8; issue #106): built, signed and notarized on a Mac runner and attached to the
  # release the job above just created, with SHA256SUMS.txt extended to cover them. It needs the Apple secrets listed in #106; without
  # them it says so and does nothing, so the Windows release is never held up by it.
  # A manual run with macos_dry_run (from any branch) builds, signs and notarizes the packages and keeps them as a workflow artifact:
  # it attaches nothing to a release and opens no cask PR, so the secrets and the signing can be tried before a release depends on them.
  macos:
    needs: release
    if: >-
      !cancelled() && github.repository == 'andrewralon/keycuts' && (
        (needs.release.outputs.released == 'true' && github.ref == 'refs/heads/main') ||
        (github.event_name == 'workflow_dispatch' && inputs.macos_dry_run)
      )
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Check for the Apple secrets
        id: secrets
        env:
          APP_CERT: ${{ secrets.APPLE_DEVID_APP_CERT_P12 }}
          INSTALLER_CERT: ${{ secrets.APPLE_DEVID_INSTALLER_CERT_P12 }}
          NOTARY_KEY: ${{ secrets.APPLE_NOTARY_KEY_P8 }}
        run: |
          if [ -n "$APP_CERT" ] && [ -n "$INSTALLER_CERT" ] && [ -n "$NOTARY_KEY" ]; then
            echo "have=true" >> "$GITHUB_OUTPUT"
          else
            echo "have=false" >> "$GITHUB_OUTPUT"
            echo "::notice::The Apple secrets (#106) aren't set, so the macOS packages were not built."
            printf '## macOS packages skipped\n\nThe Apple secrets listed in #106 are not set.\n' >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.secrets.outputs.have == 'true'
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        if: steps.secrets.outputs.have == 'true'
        with:
          global-json-file: global.json

      - name: Import the certificates
        if: steps.secrets.outputs.have == 'true'
        env:
          APP_CERT: ${{ secrets.APPLE_DEVID_APP_CERT_P12 }}
          INSTALLER_CERT: ${{ secrets.APPLE_DEVID_INSTALLER_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          NOTARY_KEY: ${{ secrets.APPLE_NOTARY_KEY_P8 }}
        run: |
          keychain="$RUNNER_TEMP/keycuts-build.keychain-db"
          password="$(uuidgen)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          echo "$APP_CERT" | base64 --decode > "$RUNNER_TEMP/app.p12"
          echo "$INSTALLER_CERT" | base64 --decode > "$RUNNER_TEMP/installer.p12"
          security import "$RUNNER_TEMP/app.p12" -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security import "$RUNNER_TEMP/installer.p12" -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/app.p12" "$RUNNER_TEMP/installer.p12"

          echo "$NOTARY_KEY" | base64 --decode > "$RUNNER_TEMP/notary-key.p8"
          app_identity="$(security find-identity -v "$keychain" | sed -n 's/.*"\(Developer ID Application:.*\)"/\1/p' | head -1)"
          installer_identity="$(security find-identity -v "$keychain" | sed -n 's/.*"\(Developer ID Installer:.*\)"/\1/p' | head -1)"
          [ -n "$app_identity" ] && [ -n "$installer_identity" ] || { echo "::error::The certificates have no Developer ID Application and Installer identities."; exit 1; }
          {
            echo "APPLE_APP_IDENTITY=$app_identity"
            echo "APPLE_INSTALLER_IDENTITY=$installer_identity"
            echo "APPLE_NOTARY_KEY_PATH=$RUNNER_TEMP/notary-key.p8"
          } >> "$GITHUB_ENV"

      - name: Build, sign and notarize
        if: steps.secrets.outputs.have == 'true'
        env:
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: tools/Build-MacPackage.sh

      - name: Keep the packages (dry run)
        if: steps.secrets.outputs.have == 'true' && github.event_name == 'workflow_dispatch' && inputs.macos_dry_run
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-packages
          path: artifacts/installer/osx-*/keycuts-setup-*.pkg
          retention-days: 7

      - name: Attach to the release
        if: steps.secrets.outputs.have == 'true' && needs.release.outputs.released == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          mkdir -p artifacts/release
          cp artifacts/installer/osx-arm64/keycuts-setup-arm64.pkg artifacts/installer/osx-x64/keycuts-setup-x64.pkg artifacts/release/
          # SHA256SUMS.txt covers all six files: the Windows lines as the release has them, then these two
          gh release download "$TAG" --pattern SHA256SUMS.txt --dir artifacts/release --clobber
          (cd artifacts/release && for pkg in keycuts-setup-arm64.pkg keycuts-setup-x64.pkg; do shasum -a 256 "$pkg" | sed 's/ \*/  /'; done >> SHA256SUMS.txt && cat SHA256SUMS.txt)
          gh release upload "$TAG" artifacts/release/keycuts-setup-arm64.pkg artifacts/release/keycuts-setup-x64.pkg artifacts/release/SHA256SUMS.txt --clobber
          # The summary the Windows job wrote lists its own files only; this adds the packages. Build-MacPackage.sh stops at the first
          # failure, so a package that got here was signed, notarized and stapled.
          {
            printf '## macOS packages for %s\n\n| Asset | Size | SHA256 |\n|---|---|---|\n' "$TAG"
            for pkg in keycuts-setup-arm64.pkg keycuts-setup-x64.pkg; do
              size="$(stat -f%z "artifacts/release/$pkg" | awk '{ printf "%.1f", $1 / 1048576 }')"
              printf '| %s | %s MB | `%s` |\n' "$pkg" "$size" "$(shasum -a 256 "artifacts/release/$pkg" | cut -d' ' -f1)"
            done
            printf '\nBoth are signed with Developer ID, notarized by Apple and stapled. `SHA256SUMS.txt` covers all six release files.\n'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Open the Homebrew cask update
        if: steps.secrets.outputs.have == 'true' && needs.release.outputs.released == 'true'
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::notice::HOMEBREW_TAP_TOKEN isn't set, so the cask in andrewralon/homebrew-tap was not updated."
            printf '\n**The Homebrew cask was not updated:** `HOMEBREW_TAP_TOKEN` is not set.\n' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if output="$(tools/mac/update-cask.sh "${TAG#v}" artifacts/installer/osx-arm64/keycuts-setup-arm64.pkg artifacts/installer/osx-x64/keycuts-setup-x64.pkg 2>&1)"; then
            printf '%s\n' "$output"
            url="$(printf '%s\n' "$output" | grep -Eo 'https://github.com/[^ ]+/pull/[0-9]+' | tail -1 || true)"
            if [ -n "$url" ]; then
              printf '\nHomebrew cask: [the pull request in the tap](%s) sets keycuts to %s. Merge it to publish the cask.\n' "$url" "${TAG#v}" >> "$GITHUB_STEP_SUMMARY"
            else
              printf '\nHomebrew cask: the tap is already at %s, so no pull request was opened.\n' "${TAG#v}" >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            printf '%s\n' "$output"
            printf '\n**The Homebrew cask update failed.** The release and its packages are fine. Check this job'"'"'s log (the token may have expired), then run `tools/mac/update-cask.sh` by hand.\n' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
