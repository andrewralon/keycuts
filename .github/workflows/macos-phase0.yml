name: Phase 0 headless probe

# Phase 0.6 of docs/macos-port.md: does Avalonia.Headless.XUnit 12 run on macos-latest (and Linux and Windows) with
# xUnit v3 on the VSTest runner? Throwaway: delete this workflow and tests/phase0 once Phase 2.1 lands.
on:
  push:
    branches: [develop]
    paths:
      - tests/phase0/**
      - .github/workflows/macos-phase0.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Runner
        shell: bash
        run: echo "$ImageOS $ImageVersion $(uname -m)" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Test
        run: dotnet test tests/phase0/HeadlessProbe --logger trx --logger "console;verbosity=normal" --results-directory artifacts/test-results

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: phase0-${{ matrix.os }}
          path: artifacts/test-results/
          if-no-files-found: ignore
          retention-days: 14
